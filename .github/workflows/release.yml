name: Release

# Pushing a tag v<version> publishes that version of apps/server to npm and makes a GitHub release for it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache in a job that publishes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: brew install tmux
      - run: pnpm install --frozen-lockfile
      - name: The tag is the package's version
        run: test "v$(node -p "require('./apps/server/package.json').version")" = "$GITHUB_REF_NAME"
      - name: The changelog has a section for it
        run: node apps/server/scripts/changelog-section.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - run: pnpm --filter workoffdesk check
      - run: pnpm --filter workoffdesk build
      - run: pnpm --filter workoffdesk test:pack
      # npm trusted publishing (OIDC): set it up for this workflow on npmjs.com after the first, manual publish.
      - working-directory: apps/server
        run: npm publish --provenance --access public
      - working-directory: apps/server
        run: |
          npm pack
          gh release create "$GITHUB_REF_NAME" workoffdesk-*.tgz --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The server needs macOS: launchd plists, tmux, the CLI's macOS checks.
  server:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: brew install tmux
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter workoffdesk check
      - run: pnpm --filter workoffdesk build
      - run: pnpm --filter workoffdesk test:pack
      # The menu bar app (apps/mac), which only a Mac builds.
      - run: swift test --package-path apps/mac

  # The web app, the iPhone app's JavaScript and the shared libraries.
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter '!workoffdesk' check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/*.test.mjs
      - run: node scripts/check-docs.mjs
      - run: node scripts/check-tests.mjs
      - run: shellcheck install.sh apps/mobile/scripts/*.sh apps/mac/scripts/*.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The server needs macOS: launchd plists, tmux, the CLI's macOS checks.
  server:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: brew install tmux
      # Each tmux pane and each terminal a test attaches takes a pty, and test files run side by side, past the
      # 511 macOS allows by default.
      - run: sudo sysctl -w kern.tty.ptmx_max=999
      - run: pnpm install --frozen-lockfile
      - run: |
          (while sleep 2; do lsof -n /dev/ptmx 2>/dev/null | tail -n +2 | wc -l; done > "$RUNNER_TEMP/ptys" 2>&1) &
          pnpm --filter workoffdesk check
      - if: always()
        run: |
          echo "most ptys open at once during the tests: $(sort -n "$RUNNER_TEMP/ptys" | tail -1)"
      - run: pnpm --filter workoffdesk build
      - run: pnpm --filter workoffdesk test:pack
      # The menu bar app (apps/mac), which only a Mac builds.
      - run: swift test --package-path apps/mac

  # The web app, the iPhone app's JavaScript and the shared libraries.
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter '!workoffdesk' check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/*.test.mjs
      - run: node scripts/check-docs.mjs
      - run: node scripts/check-tests.mjs
      - run: shellcheck install.sh apps/mobile/scripts/*.sh apps/mac/scripts/*.sh

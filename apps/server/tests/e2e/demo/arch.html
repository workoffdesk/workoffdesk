<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --dim:#8b949e; --blue:#388bfd; --green:#3fb950; --red:#f85149; --amber:#d29922; }
  * { box-sizing: border-box; }
  body { margin:0; width:1280px; height:720px; overflow:hidden; background: radial-gradient(1200px 700px at 50% 0%, #182234 0%, #0d1117 70%); color:var(--text); font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  .abs { position:absolute; }
  #cap { left:0; right:0; top:46px; text-align:center; font-size:40px; font-weight:600; letter-spacing:.5px; }
  #sub { left:0; right:0; top:104px; text-align:center; font-size:21px; color:var(--dim); }
  #dots { left:0; right:0; top:20px; display:flex; justify-content:center; gap:12px; }
  #dots i { width:8px; height:8px; border-radius:50%; background:#3a4150; display:block; }
  #dots i.on { background:var(--blue); transform:scale(1.25); }

  #phone { left:128px; top:178px; width:211px; height:444px; border-radius:40px; background:#1a1c21; border:2px solid #5c6270; padding:9px; }
  #phone .scr { position:relative; width:100%; height:100%; border-radius:32px; background:#0f141b; overflow:hidden; padding:46px 10px 12px; }
  #phone .isl { position:absolute; left:50%; top:9px; width:58px; height:17px; margin-left:-29px; border-radius:9px; background:#000; }
  #phone .home { position:absolute; left:50%; bottom:6px; width:64px; height:4px; margin-left:-32px; border-radius:2px; background:#d0d4dc; }
  .ptitle { font-size:14px; font-weight:600; text-align:center; margin-bottom:12px; }
  .prow { display:flex; align-items:center; gap:8px; padding:9px 8px; border-radius:10px; background:#161c25; margin-bottom:8px; font-size:12.5px; }
  .prow b { font-weight:600; display:block; }
  .prow small { color:var(--dim); font-size:11px; }
  .prow.hl { outline:2px solid var(--blue); }
  .ico { width:26px; height:26px; border-radius:7px; background:var(--blue); flex:none; }
  .ico.codex { background:#a371f7; }
  .ag { font-weight:600; color:#79c0ff; }
  .ag.codex { color:#d2a8ff; }
  #plabel, #mlabel { font-size:18px; color:var(--dim); text-align:center; }
  #plabel { left:128px; width:211px; top:634px; }

  #mac { left:740px; top:228px; width:440px; height:344px; border-radius:14px; background:var(--panel); border:2px solid #3b4250; overflow:hidden; }
  #mac .bar { height:30px; background:#1f252e; display:flex; align-items:center; gap:7px; padding-left:12px; }
  #mac .bar i { width:11px; height:11px; border-radius:50%; display:block; }
  #mac .body { padding:16px; }
  .svc { border:1.5px solid var(--blue); border-radius:10px; padding:10px 12px; font-size:15px; background:#11203a; }
  .svc small { color:#9ab8e8; font-size:12.5px; display:block; margin-top:2px; }
  .tmux { margin-top:14px; border:1.5px dashed #4b5262; border-radius:10px; padding:10px 10px 4px; }
  .tmux .t { font-size:12.5px; color:var(--dim); margin-bottom:8px; }
  .srow { display:flex; align-items:center; gap:10px; padding:9px 10px; background:#0f141b; border-radius:8px; margin-bottom:8px; font-size:14px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .srow .st { margin-left:auto; color:var(--dim); font-size:12.5px; }
  .spin { width:12px; height:12px; border-radius:50%; border:2px solid #2d4a7a; border-top-color:var(--blue); flex:none; }
  #mlabel { left:740px; width:440px; top:584px; }

  #term { left:700px; top:388px; width:520px; height:236px; border-radius:12px; background:#05070a; border:2px solid #4b5262; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:14.5px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  #term .bar { height:26px; background:#1f252e; display:flex; align-items:center; padding-left:12px; gap:7px; font-family:-apple-system,"PingFang SC",sans-serif; font-size:12px; color:var(--dim); }
  #term .bar i { width:10px; height:10px; border-radius:50%; display:block; }
  #term pre { margin:0; padding:12px 14px; line-height:1.55; white-space:pre-wrap; }

  #cloud { left:430px; top:170px; width:250px; height:96px; border:2px dashed #6e7681; border-radius:48px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:16px; color:var(--dim); background:rgba(22,27,34,.85); }
  #x { left:430px; top:170px; width:250px; height:96px; }
  #x::before { content:""; position:absolute; left:24px; right:24px; top:50%; height:4px; margin-top:-2px; background:var(--red); border-radius:2px; transform:rotate(-6deg); }
  #nox { left:430px; top:274px; width:250px; text-align:center; color:var(--red); font-size:16px; font-weight:600; }

  #ltop, #lbot { left:340px; width:400px; text-align:center; }
  #ltop { top:350px; font-size:18px; font-weight:600; }
  #lbot { top:432px; font-size:14.5px; color:var(--dim); line-height:1.5; }
  #off { left:470px; top:368px; width:140px; text-align:center; font-size:16px; color:var(--red); font-weight:600; }
  #end { left:0; right:0; top:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(13,17,23,.94); }
  #end .n { font-size:64px; font-weight:700; letter-spacing:-1px; }
  #end .p { margin-top:22px; display:flex; gap:14px; }
  #end .p span { border:1.5px solid #3b4250; border-radius:999px; padding:10px 20px; font-size:20px; color:#c9d1d9; }
</style>
</head>
<body>
<div id="dots" class="abs"></div>
<div id="cap" class="abs"></div>
<div id="sub" class="abs"></div>

<svg class="abs" style="left:0;top:0" width="1280" height="720">
  <line id="link" x1="339" y1="400" x2="740" y2="400" stroke="#388bfd" stroke-width="4" stroke-linecap="round" />
  <g id="packets"></g>
</svg>
<div id="ltop" class="abs"></div>
<div id="lbot" class="abs"></div>
<div id="off" class="abs"></div>

<div id="phone" class="abs"><div class="scr"><div class="isl"></div><div class="ptitle" id="ptitle"></div><div id="prows"></div><div class="home"></div></div></div>
<div id="plabel" class="abs"></div>

<div id="mac" class="abs">
  <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
  <div class="body">
    <div class="svc"><span id="svc"></span><small id="svcs"></small></div>
    <div class="tmux"><div class="t" id="tmuxl"></div><div id="srows"></div></div>
  </div>
</div>
<div id="mlabel" class="abs"></div>

<div id="cloud" class="abs"></div>
<div id="x" class="abs"></div>
<div id="nox" class="abs"></div>

<div id="term" class="abs"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span id="termt" style="margin-left:8px"></span></div><pre id="termp"></pre></div>

<div id="end" class="abs"><div class="n">workoffdesk</div><div class="p" id="pills"></div></div>

<script>
const L = {
  'zh-CN': {
    caps: [
      ['Claude Code 和 Codex 跑在你自己的 Mac 上', '每个会话放在 tmux 里，由本机的 workoffdesk 服务照看'],
      ['手机走一条 HTTPS 隧道连回 Mac', '服务只监听 127.0.0.1，隧道由你自己选'],
      ['中间没有我们的服务器', '不用注册账号，会话和代码都留在你的 Mac 上'],
      ['手机断了，会话照跑', '锁屏、断网、关掉网页，都不会停下 Claude'],
      ['回到电脑，在终端里接着干', 'workoffdesk attach，接上同一个会话'],
    ],
    phone: '你的手机', mac: '你的 Mac', list: '会话',
    svc: 'workoffdesk 服务', svcs: '只监听 127.0.0.1:7681',
    tmux: 'tmux · 关掉网页也不会结束',
    working: (n) => `在干活 · ${n} 秒`,
    rows: [['claude', 'weather-app', '登录按钮改圆角'], ['codex', 'api-server', '登录接口限流'], ['claude', 'blog', '改写成博客']],
    ltop: 'HTTPS 隧道', lbot: 'Tailscale · Cloudflare Tunnel<br>或你自己的服务器',
    cloud: '「workoffdesk 的云」', nox: '没有这一层', off: '断线',
    term: '终端', attach: (n) => `$ workoffdesk attach\n\n✻ weather-app · 登录按钮改圆角\n\n⏺ 改好了，4 个测试全过。\n  在干活 · ${n} 秒\n\n> 再把次要按钮也改成一样的`,
    pills: ['Claude Code · Codex', '跑在自己的 Mac 上', '不用注册账号', '断线不中断'],
  },
  en: {
    caps: [
      ['Claude Code and Codex run on your own Mac', 'Each session lives in tmux, looked after by the workoffdesk service'],
      ['Your phone reaches it over HTTPS', 'The service listens on 127.0.0.1 only; you pick the tunnel'],
      ['No server of ours in between', 'No account to sign up for; sessions and code stay on your Mac'],
      ['Phone gone? Sessions keep going', 'Lock it, lose signal, close the page: Claude does not stop'],
      ['Back at your desk, carry on in the terminal', 'workoffdesk attach joins the same session'],
    ],
    phone: 'Your phone', mac: 'Your Mac', list: 'Sessions',
    svc: 'workoffdesk service', svcs: 'listens on 127.0.0.1:7681 only',
    tmux: 'tmux · closing the page does not end it',
    working: (n) => `working · ${n}s`,
    rows: [['claude', 'weather-app', 'Round the sign-in button'], ['codex', 'api-server', 'Rate-limit sign-in'], ['claude', 'blog', 'Release notes post']],
    ltop: 'HTTPS tunnel', lbot: 'Tailscale · Cloudflare Tunnel<br>or your own server',
    cloud: '"workoffdesk cloud"', nox: 'there is no such layer', off: 'offline',
    term: 'Terminal', attach: (n) => `$ workoffdesk attach\n\n✻ weather-app · Round the sign-in button\n\n⏺ Done, and 4 of 4 tests pass.\n  working · ${n}s\n\n> Make the secondary buttons match`,
    pills: ['Claude Code · Codex', 'Runs on your Mac', 'No account', 'Survives a lost phone'],
  },
};
const lang = new URLSearchParams(location.search).get('lang') || 'zh-CN';
const w = L[lang];
const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const ramp = (t, a, b) => ease((t - a) / (b - a));
// Scene starts, in seconds; the end card after the last.
const SC = [0, 4.2, 8.4, 12.4, 16.8, 21.6];
const END = 24;

$('plabel').textContent = w.phone; $('mlabel').textContent = w.mac; $('ptitle').textContent = w.list;
$('svc').textContent = w.svc; $('svcs').textContent = w.svcs; $('tmuxl').textContent = w.tmux;
$('ltop').textContent = w.ltop; $('lbot').innerHTML = w.lbot; $('cloud').textContent = w.cloud; $('nox').textContent = w.nox; $('off').textContent = w.off;
$('termt').textContent = w.term;
$('pills').innerHTML = w.pills.map((p) => `<span>${p}</span>`).join('');
$('dots').innerHTML = w.caps.map(() => '<i></i>').join('');
$('srows').innerHTML = w.rows.map(([a, p]) => `<div class="srow"><div class="spin"></div><span><b class="ag ${a}">${a}</b> · ${p}</span><span class="st"></span></div>`).join('');
$('prows').innerHTML = w.rows.map(([a, p, title]) => `<div class="prow"><div class="ico ${a}"></div><div><b>${title}</b><small></small></div></div>`).join('');
for (let i = 0; i < 4; i++) {
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('r', 6); c.setAttribute('cy', 400); c.setAttribute('fill', i % 2 ? '#3fb950' : '#79c0ff');
  $('packets').appendChild(c);
}

window.render = (t) => {
  const scene = SC.findIndex((s, i) => t >= s && t < (SC[i + 1] ?? Infinity));
  const capI = Math.min(scene, w.caps.length - 1);
  const capIn = ramp(t, SC[capI], SC[capI] + 0.4);
  $('cap').textContent = w.caps[capI][0]; $('sub').textContent = w.caps[capI][1];
  for (const id of ['cap', 'sub']) { $(id).style.opacity = capIn; $(id).style.transform = `translateY(${(1 - capIn) * 10}px)`; }
  [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === capI));

  // The Mac and its sessions from the start; the phone and the link from scene 1.
  $('mac').style.opacity = ramp(t, 0.2, 0.9); $('mlabel').style.opacity = ramp(t, 0.4, 1);
  [...$('srows').children].forEach((r, i) => {
    r.style.opacity = ramp(t, 0.9 + i * 0.35, 1.3 + i * 0.35);
    r.querySelector('.spin').style.transform = `rotate(${t * 360}deg)`;
    r.querySelector('.st').textContent = w.working(Math.floor(t * 1.5) + 7 + i * 23);
  });
  const phoneIn = ramp(t, SC[1] + 0.1, SC[1] + 0.8);
  // Scene 3: the phone loses its link, then gets it back near the end of the scene.
  const offline = ramp(t, SC[3] + 0.5, SC[3] + 0.9) * (1 - ramp(t, SC[4] - 1.0, SC[4] - 0.6));
  $('phone').style.opacity = phoneIn * (1 - 0.6 * offline); $('plabel').style.opacity = phoneIn;
  $('phone').style.transform = `translateX(${(1 - phoneIn) * -30}px)`;
  [...$('prows').children].forEach((r, i) => {
    r.querySelector('small').textContent = w.working(Math.floor(t * 1.5) + 7 + i * 23);
    r.classList.toggle('hl', i === 0 && t >= SC[4] + 1.2 && t < SC[5]);
  });
  const linkIn = ramp(t, SC[1] + 0.6, SC[1] + 1.6);
  const link = $('link');
  link.setAttribute('x2', 339 + 401 * linkIn);
  link.setAttribute('stroke', offline > 0.5 ? '#f85149' : '#388bfd');
  link.setAttribute('stroke-dasharray', offline > 0.5 ? '10 12' : 'none');
  link.style.opacity = linkIn > 0 ? 1 - 0.5 * offline : 0;
  $('ltop').style.opacity = ramp(t, SC[1] + 1.4, SC[1] + 2) * (1 - offline);
  $('lbot').style.opacity = ramp(t, SC[1] + 1.8, SC[1] + 2.4) * (1 - offline);
  $('off').style.opacity = offline;
  [...$('packets').children].forEach((c, i) => {
    const flowing = t > SC[1] + 1.8 && offline < 0.1 && t < SC[5];
    const k = ((t * 0.55 + i / 4) % 1);
    const x = i % 2 ? 740 - 401 * k : 339 + 401 * k;
    c.setAttribute('cx', x);
    c.style.opacity = flowing ? Math.sin(Math.PI * k) : 0;
  });

  // Scene 2: a relay server of ours appears, and is crossed out.
  const cloud = ramp(t, SC[2] + 0.2, SC[2] + 0.7) * (1 - ramp(t, SC[3] - 0.3, SC[3]));
  $('cloud').style.opacity = cloud;
  $('x').style.opacity = ramp(t, SC[2] + 1.2, SC[2] + 1.5) * (1 - ramp(t, SC[3] - 0.3, SC[3]));
  $('x').style.clipPath = `inset(0 ${100 - 100 * ramp(t, SC[2] + 1.2, SC[2] + 1.6)}% 0 0)`;
  $('nox').style.opacity = ramp(t, SC[2] + 1.6, SC[2] + 2) * (1 - ramp(t, SC[3] - 0.3, SC[3]));

  // Scene 4: the Mac's terminal attaches to the same session.
  const term = ramp(t, SC[4] + 0.3, SC[4] + 0.9) * (1 - ramp(t, SC[5] - 0.2, SC[5]));
  $('term').style.opacity = term; $('term').style.transform = `translateY(${(1 - term) * 24}px)`;
  const full = w.attach(Math.floor(t * 1.5) + 7);
  const typed = Math.floor(clamp((t - SC[4] - 0.9) / 0.8) * 20);
  const firstLine = full.split('\n')[0];
  $('termp').textContent = t < SC[4] + 1.7 ? firstLine.slice(0, typed) + '▋' : full.slice(0, firstLine.length + Math.floor((t - SC[4] - 1.7) * 120)) + '▋';

  $('end').style.opacity = ramp(t, SC[5], SC[5] + 0.5);
};
window.END = END;
render(0);
</script>
</body>
</html>
